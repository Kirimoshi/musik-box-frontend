# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:

    # runs-on: ${{ matrix.os }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # os: [ubuntu-latest, windows-latest, macOS-latest]
        node-version: [20.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: My-Music-App/package-lock.json
      - name: Install dependencies
        working-directory: My-Music-App
        run: npm ci
      - name: Build
        working-directory: My-Music-App
        run: npm run build --if-present
        env:
          # before running this workflow, make sure to add the REACT_APP_API_URL secret in your repository settings with the appropriate value for your API URL
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: My-Music-App/build
          branch: gh-pages
      - name: Test
        working-directory: My-Music-App
        run: npm test


